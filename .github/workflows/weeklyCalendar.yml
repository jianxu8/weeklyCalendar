name: Post Weekly Calendar to Discord

on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch: # This line adds a button so you can run it manually to test

jobs:
  post-calendar:
    runs-on: ubuntu-latest

    steps:
      # Download your repository code onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python on the runner machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post Calendar to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
